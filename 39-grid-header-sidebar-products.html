
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f8;
        }

        .page {
            display: grid;
            min-height: 100vh;
            grid-template-columns: 220px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
        }

        header {
            grid-area: header;
            background-color: #243b64;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header input {
            padding: 10px;
            border: none;
            border-radius: 5px;
            width: 220px;
        }

        aside {
            grid-area: sidebar;
            background-color: white;
            padding: 25px;
        }

        aside h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        aside ul {
            list-style: none;
            padding: 0;
            margin-bottom: 25px;
        }

        aside li {
            padding: 8px 0;
        }

        main {
            grid-area: main;
            padding: 25px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .product img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
        }

        .product h3 {
            margin: 10px 0;
        }

        .product p {
            color: #00875a;
            font-weight: bold;
        }

        footer {
            grid-area: footer;
            background-color: #243b64;
            color: white;
            text-align: center;
            padding: 18px;
        }

        @media (max-width: 720px) {
            .page {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "sidebar"
                    "main"
                    "footer";
            }

            aside {
                border-bottom: 1px solid #ddd;
            }

            header input {
                width: 150px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <header>
            <h2>My Store</h2>
            <input type="search" placeholder="Search products">
        </header>

        <aside>
            <h2>Categories</h2>
            <ul>
                <li>Electronics</li>
                <li>Clothing</li>
                <li>Home</li>
                <li>Sports</li>
            </ul>

            <h2>Price Range</h2>
            <ul>
                <li>Under ₹500</li>
                <li>₹500 - ₹2000</li>
                <li>Above ₹2000</li>
            </ul>
        </aside>

        <main>
            <h1>All Products</h1>

            <div class="products">

                <article class="product">
                    <img src="https://picsum.photos/id/103/300/300" alt="Sneakers">
                    <h3>Sneakers</h3>
                    <p>₹2,499</p>
                </article>

                <article class="product">
                    <img src="https://picsum.photos/id/1070/300/300" alt="Denim jeans">
                    <h3>Denim Jeans</h3>
                    <p>₹1,299</p>
                </article>

                <article class="product">
                    <img src="https://picsum.photos/id/119/300/300" alt="Backpack">
                    <h3>Backpack</h3>
                    <p>₹899</p>
                </article>

                <article class="product">
                    <img src="https://picsum.photos/id/160/300/300" alt="Camera">
                    <h3>Camera</h3>
                    <p>₹18,999</p>
                </article>

                <article class="product">
                    <img src="https://picsum.photos/id/180/300/300" alt="Laptop">
                    <h3>Laptop</h3>
                    <p>₹54,999</p>
                </article>

                <article class="product">
                    <img src="https://picsum.photos/id/225/300/300" alt="Desk lamp">
                    <h3>Desk Lamp</h3>
                    <p>₹749</p>
                </article>

            </div>
        </main>

        <footer>
            © 2026 My Store
        </footer>

    </div>

</body>
</html>
