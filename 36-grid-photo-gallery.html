
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #17202a;
            color: white;
            padding: 25px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 180px;
            gap: 12px;
            max-width: 1100px;
            margin: auto;
        }

        figure {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        figure img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        figure:hover img {
            transform: scale(1.08);
        }

        figcaption {
            position: absolute;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            width: 100%;
            padding: 10px;
        }

        .wide {
            grid-column: span 2;
        }

        .tall {
            grid-row: span 2;
        }

        .big {
            grid-column: span 2;
            grid-row: span 2;
        }

        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .wide, .big {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <h1>My Nature Gallery</h1>

    <div class="gallery">

        <figure class="big">
            <img src="https://picsum.photos/id/1015/800/800" alt="Beautiful river valley">
            <figcaption>River Valley</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1016/400/400" alt="Beautiful canyon">
            <figcaption>Canyon</figcaption>
        </figure>

        <figure class="tall">
            <img src="https://picsum.photos/id/1018/400/800" alt="Mountain view">
            <figcaption>Mountains</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1019/400/400" alt="Lake view">
            <figcaption>Lake</figcaption>
        </figure>

        <figure class="wide">
            <img src="https://picsum.photos/id/1036/800/400" alt="Green forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1039/400/400" alt="Waterfall">
            <figcaption>Waterfall</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/id/1043/400/400" alt="Evening sky">
            <figcaption>Evening Sky</figcaption>
        </figure>

    </div>

</body>
</html>
