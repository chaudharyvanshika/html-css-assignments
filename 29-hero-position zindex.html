
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hero section built with CSS position and z-index.">
    <title>Hero Section - Position and Z-Index</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .hero {
            position: relative;
            height: 100vh;
            min-height: 500px;
            overflow: hidden;
            color: white;
        }

        /* Background image */
        .hero-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Dark overlay */
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.65),
                rgba(0, 0, 0, 0.25)
            );
            z-index: 1;
        }

        /* Navigation */
        .nav {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .logo {
            font-weight: bold;
            font-size: 24px;
        }

        /* Hero content */
        .hero-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
            width: 90%;
            max-width: 700px;
        }

        .hero-content h1 {
            font-size: clamp(32px, 6vw, 60px);
            margin-bottom: 15px;
        }

        .hero-content p {
            font-size: 19px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #ff6b35;
            color: white;
            padding: 14px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Floating rating badge */
        .badge {
            position: absolute;
            right: 30px;
            bottom: 30px;
            z-index: 3;
            background: white;
            color: #222;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }

        .badge strong {
            display: block;
            font-size: 25px;
        }

        /* Fixed back-to-top button */
        .fab {
            position: fixed;
            right: 20px;
            top: 50%;
            z-index: 10;
            background: white;
            color: #222;
            padding: 10px 15px;
            border-radius: 50%;
            text-decoration: none;
        }

        .next {
            padding: 60px 20px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .nav {
                padding: 15px;
            }

            .nav a {
                margin-left: 8px;
                font-size: 13px;
            }

            .badge {
                right: 15px;
                bottom: 15px;
            }
        }
    </style>
</head>

<body>

    <header class="hero" id="top">

        <img class="hero-bg"
            src="https://picsum.photos/id/1036/1600/900"
            alt="Snowy mountain range under a pale sky">

        <nav class="nav">
            <span class="logo">TravelNest</span>

            <div>
                <a href="#">Destinations</a>
                <a href="#">Deals</a>
                <a href="#">Contact</a>
            </div>
        </nav>

        <div class="hero-content">
            <h1>Find Your Next Adventure</h1>

            <p>
                Handpicked trips to the world's most beautiful places.
            </p>

            <a class="btn" href="#next">Start Exploring</a>
        </div>

        <div class="badge">
            <strong>4.9 ★</strong>
            12,000+ happy travellers
        </div>

    </header>

    <a class="fab" href="#top" aria-label="Back to top">↑</a>

    <section class="next" id="next">
        <h2>Popular Destinations</h2>
        <p>Explore beautiful places around the world.</p>
    </section>

</body>
</html>
