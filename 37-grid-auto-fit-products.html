
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Product Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #253858;
        }

        .note {
            text-align: center;
            color: #555;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h2 {
            font-size: 20px;
            color: #333;
        }

        .price {
            color: #00875a;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>My Product Store</h1>

    <p class="note">Explore our products. Resize the screen to see the grid change!</p>

    <div class="grid">

        <div class="card">
            <img src="https://picsum.photos/id/1060/400/300" alt="Coffee">
            <h2>Coffee Beans</h2>
            <p class="price">₹499</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/1080/400/300" alt="Fresh strawberries">
            <h2>Fresh Fruits</h2>
            <p class="price">₹199</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/292/400/300" alt="Bread">
            <h2>Fresh Bread</h2>
            <p class="price">₹149</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/312/400/300" alt="Honey jar">
            <h2>Honey Jar</h2>
            <p class="price">₹329</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/429/400/300" alt="Green tea">
            <h2>Green Tea</h2>
            <p class="price">₹259</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/493/400/300" alt="Spices">
            <h2>Spice Box</h2>
            <p class="price">₹599</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/835/400/300" alt="Olive oil">
            <h2>Olive Oil</h2>
            <p class="price">₹749</p>
        </div>

    </div>

</body>
</html>
